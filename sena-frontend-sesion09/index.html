<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Pixel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1f2937;
        }
        header {
            background: #172554;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }
        header h1 { margin: 0 0 8px; }
        header p { margin: 0; }
        main { max-width: 1100px; margin: 25px auto; padding: 0 18px; }
        .controles {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
        }
        #resumen {
            margin: 10px 0 20px;
            font-weight: bold;
        }
        #productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .producto {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
        }
        .producto h2 { margin-top: 0; font-size: 20px; }
        .precio { font-size: 20px; font-weight: bold; color: #166534; }
        .estado { font-size: 14px; }
        .disponible { color: #166534; }
        .agotado { color: #b91c1c; }
        .btn-eliminar {
            border: 0;
            border-radius: 8px;
            padding: 9px 13px;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }
        .btn-eliminar:hover { background: #991b1b; }
        .vacio {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1> Mercado Pixel</h1>
        <p>Catálogo de productos</p>
    </header>

    <main>
        <section class="controles">
            <label>
                Categoría:
                <select id="categoria">
                    <option value="todas">Todas</option>
                    <option value="tecnologia">Tecnología</option>
                    <option value="hogar">Hogar</option>
                    <option value="deportes">Deportes</option>
                    <option value="accesorios">Accesorios</option>
                </select>
            </label>

            <label>
                Precio:
                <select id="orden">
                    <option value="original">Orden original</option>
                    <option value="menor">Menor a mayor</option>
                    <option value="mayor">Mayor a menor</option>
                </select>
            </label>
        </section>

        <p id="resumen"></p>
        <section id="productos"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
